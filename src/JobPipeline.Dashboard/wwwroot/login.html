<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Job Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body class="login-page">
  <main class="login">
    <h1>Job pipeline</h1>
    <p class="sub">Sign in to see and edit your jobs.</p>
    <form id="loginForm" class="login-form" novalidate>
      <label class="field"><span>Username</span>
        <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
      <label class="field"><span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required></label>
      <label class="field check"><input name="remember" type="checkbox"> <span>Keep me signed in on this device</span></label>
      <p class="login-error" id="loginError" role="alert" hidden></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
